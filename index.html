<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova guia</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0b0914, #17102e);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .chat-container {
            display: flex;
            width: 95vw;
            max-width: 1300px;
            height: 90vh;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
            position: relative;
        }

        .drag-overlay {
            position: absolute;
            inset: 0;
            background: rgba(168, 85, 247, 0.25);
            backdrop-filter: blur(8px);
            border: 3px dashed #a855f7;
            border-radius: 20px;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            font-size: 1.5rem;
            font-weight: bold;
            pointer-events: none;
        }

        .sidebar {
            width: 320px;
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
        }

        .user-profile {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(45deg, #a855f7, #ec4899);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
        }

        .edit-btn {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: #ddd;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            transition: 0.2s;
        }

        .edit-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .rooms-header {
            padding: 16px 20px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.5);
        }

        .rooms-list {
            flex: 1;
            padding: 10px 14px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .room-item {
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-left: 3px solid transparent;
        }

        .room-item.active {
            background: rgba(168, 85, 247, 0.15);
            border-left-color: #a855f7;
            color: #d8b4fe;
        }

        .room-item:hover:not(.active) {
            background: rgba(255, 255, 255, 0.06);
        }

        /* Rádio WebRTC: o YouTube fica invisível e só o DJ o utiliza como fonte. */
        .player-visual-box {
            padding: 12px 14px;
            background: rgba(0, 0, 0, 0.35);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .radio-status {
            font-size: 0.78rem;
            color: #c4b5fd;
            line-height: 1.35;
        }

        #radio-dj-btn {
            width: 100%;
            padding: 9px 10px;
            border: 0;
            border-radius: 9px;
            background: #a855f7;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }

        #youtube-player {
            width: 200px;
            height: 200px;
            border-radius: 12px;
            background: #000;
            overflow: hidden;
        }

        /* Player Bar Sincronizado */
        .music-player-bar {
            padding: 12px 20px;
            background: rgba(15, 12, 30, 0.85);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            z-index: 10;
        }

        .music-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            overflow: hidden;
        }

        .music-disc {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ec4899, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            animation: spin 4s linear infinite;
            animation-play-state: paused;
        }

        .music-disc.playing {
            animation-play-state: running;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .music-title-wrap {
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .music-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: #fff;
        }

        .music-status {
            font-size: 0.75rem;
            color: #a855f7;
        }

        .music-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .music-btn {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
            transition: 0.2s;
        }

        .music-btn:hover {
            background: #a855f7;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.15);
            position: relative;
        }

        .chat-header {
            padding: 16px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .messages-container {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 65%;
            padding: 12px 18px;
            border-radius: 14px;
            line-height: 1.4;
            display: flex;
            flex-direction: column;
            word-break: break-word;
            position: relative;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.sent {
            background: #7c3aed;
            align-self: flex-end;
            border-bottom-right-radius: 3px;
        }

        .message.received {
            background: rgba(255, 255, 255, 0.08);
            align-self: flex-start;
            border-bottom-left-radius: 3px;
        }

        .message.system {
            background: rgba(168, 85, 247, 0.15);
            align-self: center;
            max-width: 85%;
            border: 1px solid rgba(168, 85, 247, 0.3);
            text-align: center;
            font-size: 0.85rem;
            color: #d8b4fe;
        }

        .message-user {
            font-size: 0.75rem;
            color: #d8b4fe;
            margin-bottom: 4px;
            font-weight: bold;
        }

        .message-img {
            max-width: 100%;
            max-height: 320px;
            border-radius: 10px;
            margin-top: 6px;
            object-fit: cover;
            cursor: pointer;
        }

        /* Modal de Busca de Músicas */
        .music-search-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 520px;
            max-height: 540px;
            background: #181230;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            display: none;
            flex-direction: column;
            z-index: 200;
            overflow: hidden;
        }

        .music-search-modal.active {
            display: flex;
        }

        .music-modal-header {
            padding: 16px;
            background: rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .music-modal-header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .music-modal-header input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            outline: none;
            font-size: 0.95rem;
        }

        .music-results-list {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .music-item-result {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .music-item-result:hover {
            background: rgba(168, 85, 247, 0.2);
            transform: translateX(4px);
        }

        .music-item-thumb {
            width: 54px;
            height: 40px;
            border-radius: 6px;
            object-fit: cover;
        }

        .music-item-info {
            flex: 1;
            overflow: hidden;
        }

        .music-item-title {
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .music-item-author {
            font-size: 0.75rem;
            color: #a855f7;
        }

        /* Painel GIF */
        .gif-modal {
            position: absolute;
            bottom: 85px;
            left: 24px;
            width: 420px;
            height: 460px;
            background: #181230;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            display: none;
            flex-direction: column;
            z-index: 50;
            overflow: hidden;
        }

        .gif-modal.active {
            display: flex;
        }

        .gif-header {
            padding: 14px;
            background: rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .gif-header input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            outline: none;
            font-size: 0.9rem;
        }

        .gif-categories {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .gif-cat-tag {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: #ddd;
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
        }

        .gif-cat-tag:hover {
            background: #a855f7;
            color: #fff;
        }

        .gif-grid {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .gif-item {
            width: 100%;
            height: 110px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            background: rgba(255,255,255,0.05);
        }

        .gif-item:hover {
            transform: scale(1.03);
            filter: brightness(1.1);
        }

        .input-area-wrapper {
            padding: 16px 24px;
            background: rgba(0, 0, 0, 0.35);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .file-preview {
            display: none;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.08);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            width: fit-content;
        }

        .file-preview span.remove-btn {
            color: #ec4899;
            cursor: pointer;
            font-weight: bold;
        }

        .input-area {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-area input[type="text"] {
            flex: 1;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            outline: none;
            transition: 0.2s;
        }

        .input-area input[type="text"]:focus {
            border-color: #a855f7;
            background: rgba(255, 255, 255, 0.08);
        }

        .tool-btn {
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.08);
            border: none;
            border-radius: 10px;
            color: #fff;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tool-btn:hover {
            background: rgba(255, 255, 255, 0.18);
        }

        .send-btn {
            padding: 12px 24px;
            background: #a855f7;
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .send-btn:hover {
            background: #9333ea;
        }

        #file-input {
            display: none;
        }
    </style>
<style>
#media-player-container{position:absolute!important;width:1px!important;height:1px!important;overflow:hidden!important;opacity:0!important;pointer-events:none!important;left:-9999px!important;top:-9999px!important}
#youtube-player{width:1px!important;height:1px!important}

<body>

    <div class="chat-container" id="drop-zone">
        <div class="drag-overlay" id="drag-overlay">Solte ou cole sua imagem aqui 📸</div>

        <!-- Lateral -->
        <div class="sidebar">
            <div class="user-profile">
                <div class="user-info">
                    <div class="avatar" id="user-avatar">U</div>
                    <div>
                        <h4 id="username-display">Usuário</h4>
                        <span style="font-size: 0.75rem; color: #4ade80;">● Online</span>
                    </div>
                </div>
                <button class="edit-btn" id="change-user-btn">Alterar</button>
            </div>

            <div class="rooms-header">
                <span>Salas</span>
                <button class="edit-btn" id="create-room-btn">+ Nova Sala</button>
            </div>

            <div class="rooms-list" id="rooms-list"></div>

            <!-- Rádio compartilhada por WebRTC -->
            <div class="player-visual-box">
                <div style="font-size: 0.75rem; color: #aaa;">🎧 Rádio da sala</div>
                <div class="radio-status" id="radio-status">Conectando à rádio...</div>
                <button id="radio-dj-btn">🔊 Ativar áudio</button>
                <div id="media-player-container"><div id="youtube-player"></div></div>
            </div>
        </div>

        <!-- Área Principal -->
        <div class="chat-area">
            <!-- Barra de Música Sincronizada -->
            <div class="music-player-bar">
                <div class="music-info">
                    <div class="music-disc" id="music-disc">🎵</div>
                    <div class="music-title-wrap">
                        <div class="music-title" id="now-playing-title">Nenhuma música tocando</div>
                        <div class="music-status" id="now-playing-status">Pesquise qualquer música ou artista</div>
                    </div>
                </div>
                <div class="music-controls">
                    <button class="music-btn" id="add-track-btn" style="background: #a855f7;">🔍 Pesquisar Música</button>
                </div>
            </div>

            <div class="chat-header">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <h3 id="current-room-title"># geral</h3>
                </div>
                <span style="font-size: 0.8rem; color: rgba(255,255,255,0.5);">Pesquise direto ou use <b>!play nome</b></span>
            </div>
            
            <div class="messages-container" id="messages"></div>

            <!-- Modal de Busca de Música -->
            <div class="music-search-modal" id="music-modal">
                <div class="music-modal-header">
                    <div class="music-modal-header-top">
                        <h4 style="font-size: 0.95rem;">Buscar Qualquer Música</h4>
                        <button class="edit-btn" id="close-music-modal">✕ Fechar</button>
                    </div>
                    <input type="text" id="music-search-input" placeholder="Digite cantor ou música (ex: Derek, Matuê, Sertanejo, Funk)...">
                </div>
                <div class="music-results-list" id="music-results">
                    <p style="padding: 15px; color: #aaa; text-align: center; font-size: 0.85rem;">Digite para pesquisar...</p>
                </div>
            </div>

            <!-- Modal GIF Integrado -->
            <div class="gif-modal" id="gif-modal">
                <div class="gif-header">
                    <input type="text" id="gif-search" placeholder="Buscar qualquer GIF...">
                    <div class="gif-categories">
                        <button class="gif-cat-tag" data-q="memes">😂 Memes</button>
                        <button class="gif-cat-tag" data-q="musica">🎧 Música</button>
                        <button class="gif-cat-tag" data-q="risada">🤣 Risada</button>
                        <button class="gif-cat-tag" data-q="futebol">⚽ Futebol</button>
                        <button class="gif-cat-tag" data-q="anime">⚡ Anime</button>
                        <button class="gif-cat-tag" data-q="danca">💃 Dança</button>

            <!-- Input -->
            <div class="input-area-wrapper">
                <div class="file-preview" id="file-preview">
                    <span id="file-preview-name">📸 Imagem carregada</span>
                    <span class="remove-btn" id="remove-file-btn">✕</span>

                    <label for="file-input" class="tool-btn" title="Enviar Imagem">📷</label>
                    <input type="file" id="file-input" accept="image/*">

                    <button class="tool-btn" id="toggle-gif-btn" title="Buscar GIFs">GIF</button>
                    
                    <input type="text" id="message-input" placeholder="Digite uma mensagem ou !play [nome]...">
                    <button class="send-btn" id="send-button">Enviar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- YouTube Iframe API Oficial -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <!-- Firebase -->
    
<script>
(function(){
  const $ = (id) => document.getElementById(id);
  const messagesContainer=$('messages'), messageInput=$('message-input'), sendButton=$('send-button');
  const fileInput=$('file-input'), filePreview=$('file-preview'), filePreviewName=$('file-preview-name'), removeFileBtn=$('remove-file-btn');
  const currentRoomTitle=$('current-room-title'), roomsList=$('rooms-list');
  const gifModal=$('gif-modal'), gifSearch=$('gif-search'), gifGrid=$('gif-grid');
  const dragOverlay=$('drag-overlay'), musicDisc=$('music-disc'), nowPlayingTitle=$('now-playing-title'), nowPlayingStatus=$('now-playing-status');
  const musicModal=$('music-modal'), musicSearchInput=$('music-search-input'), musicResults=$('music-results');
  const radioDJBtn=$('radio-dj-btn'), radioStatus=$('radio-status');

  let meuNome=localStorage.getItem('chat_username')||'Amigo_'+Math.floor(Math.random()*1000);
  let currentRoom='geral', socket=null, roomList={'geral':{name:'geral',password:false}};
  let radioState=null, audioUnlocked=false, ytPlayer=null, ytReady=false, pendingState=null, lastVideo='';
  let selectedFileBase64=null, reconnectTimer=null;

  function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
  function escAttr(v){return esc(v).replace(/`/g,'&#096;');}
  function setProfile(){
    $('username-display').innerText=meuNome; $('user-avatar').innerText=meuNome.charAt(0).toUpperCase();
    localStorage.setItem('chat_username',meuNome);
  }
  setProfile();

  function wsUrl(){
    const p=location.protocol==='https:'?'wss:':'ws:';
    return p+'//'+location.host+'/ws';
  }
  function connect(){
    clearTimeout(reconnectTimer);
    try{socket?.close()}catch(_){}
    socket=new WebSocket(wsUrl());
    socket.onopen=()=>{
      updateRadioStatus('🟢 Conectado • '+(radioState?.title||'rádio pronta'));
      socket.send(JSON.stringify({type:'join',room:currentRoom,name:meuNome}));
    };
    socket.onmessage=(e)=>{
      let m; try{m=JSON.parse(e.data)}catch(_){return}
      if(m.type==='welcome'){ if(m.rooms) {roomList=m.rooms; renderRooms()} if(m.roomState) applyRadioState(m.roomState,true); if(m.messages) renderMessages(m.messages); return; }
      if(m.type==='joined'){ currentRoom=m.room; renderRooms(); return; }
      if(m.type==='rooms'){roomList=m.rooms||roomList; renderRooms(); return;}
      if(m.type==='message'){ if(m.message?.room===currentRoom) appendMessage(m.message); return; }
      if(m.type==='history'){ if(m.room===currentRoom) renderMessages(m.messages||[]); return; }
      if(m.type==='radio'){ if(m.room===currentRoom) applyRadioState(m.state||null,true); return; }
      if(m.type==='error'){ console.warn(m.message); if(m.action==='join') alert(m.message); }
    };
    socket.onclose=()=>{updateRadioStatus('🟠 Reconectando à rádio...'); reconnectTimer=setTimeout(connect,1200)};
    socket.onerror=()=>{};
  }
  function send(o){
    if(!socket||socket.readyState!==WebSocket.OPEN){alert('Conexão ainda não pronta. Aguarde um instante.');return false}
    socket.send(JSON.stringify(o)); return true;
  }

  // YouTube IFrame API — vídeo fica invisível, mas continua sendo a fonte do áudio.
  window.onYouTubeIframeAPIReady=()=>{window._ytApi=true;createPlayer()};
  function createPlayer(){
    if(!window._ytApi||ytPlayer||!window.YT?.Player)return;
    ytPlayer=new YT.Player('youtube-player',{
      width:'1',height:'1',videoId:'',
      playerVars:{autoplay:0,controls:0,playsinline:1,rel:0,modestbranding:1,iv_load_policy:3,disablekb:1,fs:0},
      events:{
        onReady:()=>{ytReady=true;if(pendingState)syncPlayer(true)},
        onStateChange:(e)=>{
          if(e.data===YT.PlayerState.PLAYING){musicDisc?.classList.add('playing');}
          if(e.data===YT.PlayerState.ENDED){musicDisc?.classList.remove('playing');}
        },
        onError:(e)=>updateRadioStatus('⚠️ O YouTube não permite reproduzir esta faixa (erro '+e.data+'). Escolha outra.')
      }
    });
  }
  function statePosition(s){
    if(!s?.startedAt)return 0;
    return Math.max(0,(Date.now()-Number(s.startedAt))/1000);
  }
  function syncPlayer(force=false){
    if(!ytPlayer||!ytReady||!radioState?.videoId)return;
    const pos=statePosition(radioState);
    if(lastVideo!==radioState.videoId||force){
      lastVideo=radioState.videoId;
      try{ytPlayer.loadVideoById({videoId:radioState.videoId,startSeconds:pos})}catch(_){try{ytPlayer.loadVideoById(radioState.videoId)}catch(__){}}
      if(audioUnlocked) setTimeout(()=>{try{ytPlayer.seekTo(statePosition(radioState),true);ytPlayer.playVideo()}catch(_){}},250);
      return;
    }
    let actual=0;try{actual=Number(ytPlayer.getCurrentTime?.()||0)}catch(_){}
    const diff=pos-actual;
    if(Math.abs(diff)>1.0){try{ytPlayer.seekTo(Math.max(0,pos),true)}catch(_){}}
    if(audioUnlocked&&radioState.playing!==false){try{ytPlayer.playVideo()}catch(_){}}
    if(radioState.playing===false){try{ytPlayer.pauseVideo()}catch(_){}}
  }
  function applyRadioState(s,force=false){
    radioState=s||null; pendingState=s||null;
    nowPlayingTitle.textContent=s?.title||'Nenhuma música tocando';
    nowPlayingStatus.textContent=s?.title?`Rádio da sala • ${s.startedBy||'DJ'}`:'Pesquise qualquer música ou artista';
    musicDisc?.classList.toggle('playing',!!s?.playing);
    if(!s?.videoId){updateRadioStatus('🎧 Rádio pronta • escolha uma música');return}
    updateRadioStatus((audioUnlocked?'🔴':'🔊')+' '+s.title+' • '+(audioUnlocked?'ao vivo':'clique em Ativar áudio'));
    if(ytReady)syncPlayer(force);
  }
  radioDJBtn.onclick=()=>{
    audioUnlocked=true;
    radioDJBtn.textContent='🔊 Áudio ativado';
    radioDJBtn.classList.add('active');
    if(radioState)syncPlayer(true);
    updateRadioStatus(radioState?.title?'🔴 '+radioState.title+' • ao vivo':'🔊 Áudio ativado • escolha uma música');
  };

  setInterval(()=>{if(radioState&&ytReady)syncPlayer(false)},2000);

  // Rooms
  function renderRooms(){
    roomsList.innerHTML='';
    Object.entries(roomList).forEach(([id,r])=>{
      const d=document.createElement('div'); d.className='room-item'+(id===currentRoom?' active':'');
      d.innerHTML=`<span># ${esc(r.name||id)}${r.password?' 🔒':''}</span>`;
      d.onclick=()=>joinRoom(id);
      roomsList.appendChild(d);
    });
    currentRoomTitle.textContent='# '+(roomList[currentRoom]?.name||currentRoom);
  }
  function joinRoom(id){
    const r=roomList[id]; if(!r)return;
    if(r.password){const p=prompt('Digite a senha para entrar em #'+(r.name||id)+':'); if(p===null)return; send({type:'join',room:id,name:meuNome,password:p});}
    else send({type:'join',room:id,name:meuNome});
    messagesContainer.innerHTML='<div style="padding:20px;color:#aaa">Conectando à sala...</div>';
  }
  $('create-room-btn').onclick=()=>{
    const name=prompt('Nome da nova sala:'); if(!name?.trim())return;
    const password=prompt('Senha da sala (deixe vazio para pública):')||'';
    const id=name.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
    if(!id)return alert('Nome de sala inválido.');
    send({type:'createRoom',room:id,name:name.trim(),password});
  };

  // Search
  let searchTimer;
  musicSearchInput.addEventListener('input',()=>{
    clearTimeout(searchTimer); searchTimer=setTimeout(()=>searchYouTube(musicSearchInput.value.trim()),400);
  });
  $('add-track-btn').onclick=()=>{musicModal.classList.add('active');musicSearchInput.focus()};
  $('close-music-modal').onclick=()=>musicModal.classList.remove('active');

  async function searchYouTube(q){
    if(!q){musicResults.innerHTML='<p style="padding:15px;color:#aaa;text-align:center">Digite uma música, artista ou cole um link do YouTube...</p>';return}
    const id=extractVideoId(q);
    if(id){
      musicResults.innerHTML='<div class="music-item-result" style="cursor:pointer"><div class="music-item-info"><div class="music-item-title">▶️ Usar este vídeo do YouTube</div><div class="music-item-author">'+esc(q)+'</div></div></div>';
      musicResults.firstElementChild.onclick=()=>selectTrack(id,'YouTube • '+id); return;
    }
    musicResults.innerHTML='<p style="padding:15px;color:#aaa;text-align:center">🔎 Procurando...</p>';
    try{
      const r=await fetch('/api/search?q='+encodeURIComponent(q));
      const text=await r.text(); let data;
      try{data=JSON.parse(text)}catch(_){throw new Error('O servidor de busca não retornou JSON válido.')}
      if(!r.ok||data.error)throw new Error(data.error||('HTTP '+r.status));
      if(!data.items?.length){musicResults.innerHTML='<p style="padding:15px;color:#aaa;text-align:center">Nenhuma faixa encontrada.</p>';return}
      musicResults.innerHTML='';
      data.items.forEach(item=>{
        const d=document.createElement('div');d.className='music-item-result';
        d.innerHTML=`<img src="${escAttr(item.thumbnail||'')}" style="width:64px;height:44px;object-fit:cover;border-radius:7px"><div class="music-item-info"><div class="music-item-title">${esc(item.title)}</div><div class="music-item-author">${esc(item.channelTitle||'YouTube')}</div></div>`;
        d.onclick=()=>selectTrack(item.videoId,item.title);musicResults.appendChild(d);
      });
    }catch(e){musicResults.innerHTML='<p style="padding:15px;color:#ff8b8b;text-align:center">Falha na busca: '+esc(e.message)+'</p>'}
  }
  function extractVideoId(v){
    const m=String(v).match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
    return m?m[1]:(/^[A-Za-z0-9_-]{11}$/.test(v)?v:null);
  }
  function selectTrack(videoId,title){
    if(!send({type:'radio',room:currentRoom,state:{videoId,title:title||'Música',playing:true,startedAt:Date.now(),startedBy:meuNome}}))return;
    musicModal.classList.remove('active');
  }

  // Messages
  function renderMessages(list){
    messagesContainer.innerHTML='';
    (list||[]).slice(-150).forEach(appendMessage);
    messagesContainer.scrollTop=messagesContainer.scrollHeight;
  }
  function appendMessage(m){
    if(!m||m.room!==currentRoom)return;
    const isSent=m.user===meuNome;
    if(m.isSystem){const d=document.createElement('div');d.className='system-message';d.textContent=m.text||'';messagesContainer.appendChild(d);return}
    const d=document.createElement('div');d.className='message '+(isSent?'sent':'received');
    d.innerHTML=`<div class="message-bubble">${!isSent?`<div class="message-sender">${esc(m.user||'Amigo')}</div>`:''}${m.text?esc(m.text).replace(/\n/g,'<br>'):''}${m.image?`<img src="${escAttr(m.image)}" style="max-width:260px;border-radius:10px;margin-top:7px;display:block">`:''}</div>`;
    messagesContainer.appendChild(d);messagesContainer.scrollTop=messagesContainer.scrollHeight;
  }
  function handleSend(){
    const text=messageInput.value.trim(),img=selectedFileBase64;
    if(!text&&!img)return;
    messageInput.value=''; selectedFileBase64=null; fileInput.value=''; filePreview.style.display='none';
    if(text.toLowerCase().startsWith('!play ')){musicModal.classList.add('active');musicSearchInput.value=text.slice(6).trim();searchYouTube(musicSearchInput.value);return}
    send({type:'message',room:currentRoom,message:{user:meuNome,text:text||null,image:img||null}});
  }
  sendButton.onclick=handleSend;
  messageInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();handleSend()}});

  // Profile
  $('change-user-btn').onclick=()=>{const n=prompt('Escolha seu novo nome:',meuNome);if(n?.trim()){meuNome=n.trim();setProfile();if(socket?.readyState===1)send({type:'rename',name:meuNome,room:currentRoom})}};

  // Images
  function compress(file,label='Imagem'){
    const r=new FileReader();r.onload=e=>{const img=new Image();img.onload=()=>{
      let w=img.width,h=img.height,max=650;if(w>max||h>max){if(w>h){h=Math.round(h*max/w);w=max}else{w=Math.round(w*max/h);h=max}}
      const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);selectedFileBase64=c.toDataURL('image/jpeg',.55);
      filePreviewName.textContent='📸 '+label;filePreview.style.display='flex';
    };img.src=e.target.result};r.readAsDataURL(file)
  }
  window.addEventListener('paste',e=>{for(const i of e.clipboardData?.items||[]){if(i.type.startsWith('image/')){compress(i.getAsFile(),'Imagem colada');break}}});
  fileInput.onchange=()=>{const f=fileInput.files?.[0];if(f)compress(f)};
  removeFileBtn.onclick=()=>{selectedFileBase64=null;fileInput.value='';filePreview.style.display='none'};
  ['dragenter','dragover'].forEach(ev=>window.addEventListener(ev,e=>{e.preventDefault();dragOverlay.classList.add('active')}));
  ['dragleave','drop'].forEach(ev=>window.addEventListener(ev,e=>{e.preventDefault();dragOverlay.classList.remove('active')}));
  window.addEventListener('drop',e=>{const f=e.dataTransfer?.files?.[0];if(f?.type.startsWith('image/'))compress(f,'Imagem arrastada')});

  // GIFs: optional server endpoint; if not configured, direct GIF URL can still be sent.
  $('toggle-gif-btn').onclick=()=>{gifModal.classList.add('active');loadGifs('funny')};
  $('close-gif-modal').onclick=()=>gifModal.classList.remove('active');
  async function loadGifs(q){
    gifGrid.innerHTML='<p style="padding:15px;color:#aaa">Carregando GIFs...</p>';
    try{
      const r=await fetch('/api/gifs?q='+encodeURIComponent(q)); const d=await r.json();
      gifGrid.innerHTML='';
      (d.data||[]).forEach(g=>{const img=document.createElement('img');img.src=g.url;img.className='gif-item';img.onclick=()=>{gifModal.classList.remove('active');send({type:'message',room:currentRoom,message:{user:meuNome,image:img.src}})};gifGrid.appendChild(img)});
      if(!d.data?.length)gifGrid.innerHTML='<p style="padding:15px;color:#aaa">Nenhum GIF. Configure GIPHY_API_KEY no Worker.</p>';
    }catch(_){gifGrid.innerHTML='<p style="padding:15px;color:#aaa">GIFs indisponíveis no momento.</p>'}
  }
  document.querySelectorAll('.gif-cat-tag').forEach(b=>b.onclick=()=>loadGifs(b.dataset.q));
  gifSearch.oninput=()=>{clearTimeout(window._gifTimer);window._gifTimer=setTimeout(()=>loadGifs(gifSearch.value.trim()||'funny'),450)};

  // Start
  renderRooms();connect();
})();
</script>

</body>
</html>
